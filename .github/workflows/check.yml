name: Public tools checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test with synthetic inputs
        run: make test ARTIFACT_DIR="$RUNNER_TEMP/vigil-engineering-check"
